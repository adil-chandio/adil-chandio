<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 560" width="1200" height="560" font-family="Manrope,'Segoe UI',system-ui,sans-serif"><defs><pattern id="dots2" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#1c1c20"/></pattern></defs><rect x="1" y="1" width="1198" height="558" rx="22" fill="#0a0a0b"/><rect x="1" y="1" width="1198" height="558" rx="22" fill="url(#dots2)"/><rect x="1" y="1" width="1198" height="558" rx="22" fill="none" stroke="#2a2a2e" stroke-width="2"/>
<text x="70" y="92" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace" font-size="16" letter-spacing="4" fill="#8a8781">01 &#8212; WHAT I ACTUALLY DO</text>
<rect x="640" y="150" width="496" height="260" rx="18" fill="#111113" stroke="#2a2a2e"/>
<text x="70" y="190" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace" font-size="20" fill="#d21f2b">01</text><text x="130" y="194" font-size="34" font-weight="800" fill="#ece9e2">Reference-matched films</text><text x="130" y="226" font-size="19" fill="#8a8781">style-matched frame for frame, rebuilt clean</text><rect x="70" y="206" width="46" height="3" fill="#d21f2b"/><text x="70" y="298" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace" font-size="20" fill="#d21f2b">02</text><text x="130" y="302" font-size="34" font-weight="800" fill="#ece9e2">YouTube automation systems</text><text x="130" y="334" font-size="19" fill="#8a8781">channels that plan, script and schedule themselves</text><rect x="70" y="314" width="46" height="3" fill="#d21f2b"/><text x="70" y="406" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace" font-size="20" fill="#d21f2b">03</text><text x="130" y="410" font-size="34" font-weight="800" fill="#ece9e2">AI-folded content</text><text x="130" y="442" font-size="19" fill="#8a8781">shorts, films, voice, motion — new tools every day</text><rect x="70" y="422" width="46" height="3" fill="#d21f2b"/><g opacity="1"><animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.3333;0.6666;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><text x="700" y="250" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace" font-size="26" letter-spacing="3" fill="#d21f2b">FILMS &amp; EDITS</text><text x="700" y="292" font-size="20" fill="#8a8781">cuts locked to the beat, composites, clean finish</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3333;0.6666;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><text x="700" y="250" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace" font-size="26" letter-spacing="3" fill="#d21f2b">AI TOOLS DAILY</text><text x="700" y="292" font-size="20" fill="#8a8781">learning new tools every day, folding them into content</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.3333;0.6666;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><text x="700" y="250" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace" font-size="26" letter-spacing="3" fill="#d21f2b">CREATIVITY FIRST</text><text x="700" y="292" font-size="20" fill="#8a8781">I love creativity — it&#8217;s the whole reason I start</text></g><rect x="700" y="352" width="108" height="4" rx="2" fill="#222226"/><rect x="700" y="352" width="0" height="4" rx="2" fill="#d21f2b"><animate attributeName="width" values="0;108;108;108;0" keyTimes="0;0.3332;0.3333;0.9999;1" dur="12s" repeatCount="indefinite"/></rect><rect x="824" y="352" width="108" height="4" rx="2" fill="#222226"/><rect x="824" y="352" width="0" height="4" rx="2" fill="#d21f2b"><animate attributeName="width" values="0;0;108;108;0" keyTimes="0;0.3333;0.6665;0.9999;1" dur="12s" repeatCount="indefinite"/></rect><rect x="948" y="352" width="108" height="4" rx="2" fill="#222226"/><rect x="948" y="352" width="0" height="4" rx="2" fill="#d21f2b"><animate attributeName="width" values="0;0;0;108;108" keyTimes="0;0.3333;0.6666;0.9999;1" dur="12s" repeatCount="indefinite"/></rect>
<text x="700" y="204" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace" font-size="15" letter-spacing="3" fill="#8a8781">OFF THE CLOCK</text>
</svg>